services:
  olt-scheduler:
    build: .
    container_name: isp_olt_scheduler
    volumes:
      - .:/code
      - ./data:/code/data
      - ./logs:/code/logs
      - ./media:/code/media
      - ./staticfiles:/code/staticfiles
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://postgres:postgres@isp-db-1:5432/isp
      - REDIS_URL=redis://:Redis2025SecureAuth@isp-redis-1:6379/0
      - NOKIA_DEVICE_TYPE=${NOKIA_DEVICE_TYPE}
      - NOKIA_HOST=${NOKIA_HOST}
      - NOKIA_USERNAME=${NOKIA_USERNAME}
      - NOKIA_PASSWORD=${NOKIA_PASSWORD}
      - NOKIA_VERBOSE=${NOKIA_VERBOSE}
      - NOKIA_GLOBAL_DELAY_FACTOR=${NOKIA_GLOBAL_DELAY_FACTOR}
    command: python /code/start_olt_scheduler.py
    restart: unless-stopped
    networks:
      - isp_app-network

networks:
  isp_app-network:
    external: true