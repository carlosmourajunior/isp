server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Estáticos com hash no nome (Vite) podem ser cacheados por bastante tempo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota que não seja um arquivo real cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
