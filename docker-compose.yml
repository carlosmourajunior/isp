services:
  # ==================== APLICAÇÃO PRINCIPAL ====================
  db:
    image: postgres:13
    volumes:
      - ./data/postgres:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    # ports: []  # REMOVIDO PARA SEGURANÇA
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7.2
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --appendonly yes --appendfsync everysec
    # ports: []  # REMOVIDO PARA SEGURANÇA
    volumes:
      - ./data/redis:/data
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build: .
    command: gunicorn isp.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile - --error-logfile -
    volumes:
      - .:/code
      - ./data/media:/code/media
      - ./data/staticfiles:/code/staticfiles
      - ./data/logs:/code/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=isp.settings
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  rq_worker:
    build: .
    command: python /code/manage.py rqworker default
    volumes:
      - .:/code
      - ./data/media:/code/media
      - ./data/staticfiles:/code/staticfiles
      - ./data/logs:/code/logs
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=isp.settings
    restart: unless-stopped
    networks:
      - app-network

  # SCHEDULER DESABILITADO POR SEGURANÇA
  # scheduler:
  #   build: .
  #   entrypoint: []
  #   command: python /code/run_scheduler.py
  #   volumes:
