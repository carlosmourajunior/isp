services:
  # ==================== APLICAÇÃO PRINCIPAL ====================
  db:
    image: postgres:13
    volumes:
      - ./data/postgres:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    # ports: []  # REMOVIDO PARA SEGURANÇA
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7.2
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --appendonly yes --appendfsync everysec
    # ports: []  # REMOVIDO PARA SEGURANÇA
    volumes:
      - ./data/redis:/data
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    image: ${WEB_IMAGE:-ghcr.io/carlosmourajunior/isp-web}:${IMAGE_TAG:-latest}
    labels:
      - com.centurylinklabs.watchtower.enable=true
    command: gunicorn isp.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile - --error-logfile -
    volumes:
      - ./data/media:/code/media
      - ./data/staticfiles:/code/staticfiles
      - ./data/logs:/code/logs
    ports:
      # Depois de migrar todo mundo para o HTTPS, troque no .env para WEB_PORT=127.0.0.1:8000
      # (a API passa a ser acessível só pelo proxy).
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=isp.settings
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  rq_worker:
    image: ${WEB_IMAGE:-ghcr.io/carlosmourajunior/isp-web}:${IMAGE_TAG:-latest}
    labels:
      - com.centurylinklabs.watchtower.enable=true
    command: python /code/manage.py rqworker default
    volumes:
      - ./data/media:/code/media
      - ./data/staticfiles:/code/staticfiles
      - ./data/logs:/code/logs
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=isp.settings
    restart: unless-stopped
    networks:
      - app-network

  # Recebe syslog (UDP) das OLTs e grava eventos de ONT - ocupação de CTO.
  # Passivo: não abre SSH na OLT. Ver olt/management/commands/run_syslog_collector.py
  syslog_collector:
    image: ${WEB_IMAGE:-ghcr.io/carlosmourajunior/isp-web}:${IMAGE_TAG:-latest}
    labels:
      - com.centurylinklabs.watchtower.enable=true
    command: python /code/manage.py run_syslog_collector --port 5140
    ports:
      - "${SYSLOG_PORT:-5140}:5140/udp"
    volumes:
      - ./data/logs:/code/logs
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=isp.settings
    restart: unless-stopped
    networks:
      - app-network

  # ==================== FRONTEND (React) ====================
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/carlosmourajunior/isp-frontend}:${IMAGE_TAG:-latest}
    labels:
      - com.centurylinklabs.watchtower.enable=true
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - app-network

  # ==================== HTTPS (proxy reverso) ====================
  # Caddy: emite e renova o certificado sozinho (Let's Encrypt). Só sobe com o
  # profile "https" (COMPOSE_PROFILES=https no .env). Ver deploy/Caddyfile e DEPLOY.md.
  proxy:
    image: caddy:2.8
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    depends_on:
      - web
      - frontend
    restart: unless-stopped
    networks:
      - app-network

  # ==================== DEPLOY AUTOMÁTICO ====================
  # Atualiza só os serviços com a label watchtower.enable=true (web, rq_worker,
  # frontend) quando o CI publica imagem nova no GHCR. db/redis ficam de fora.
  # Repo privado: precisa de `docker login ghcr.io` no servidor (ver DEPLOY.md).
  watchtower:
    image: containrrr/watchtower
    command: --label-enable --cleanup --interval ${WATCHTOWER_INTERVAL:-60}
    environment:
      # Docker recente recusa o cliente API antigo embutido no watchtower.
      - DOCKER_API_VERSION=${DOCKER_API_VERSION:-1.44}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_JSON:-${HOME}/.docker/config.json}:/config.json:ro
    restart: unless-stopped
    networks:
      - app-network

  # Atualização automática das OLTs - processo ÚNICO (não rodar em web/rq_worker,
  # senão a mesma atualização é enfileirada várias vezes). Liga/desliga e
  # intervalo ficam no admin: "Atualização automática". Ver olt/auto_update.py
  scheduler:
    image: ${WEB_IMAGE:-ghcr.io/carlosmourajunior/isp-web}:${IMAGE_TAG:-latest}
    labels:
      - com.centurylinklabs.watchtower.enable=true
    command: python /code/manage.py run_scheduler
    volumes:
      - ./data/logs:/code/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=isp.settings
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
